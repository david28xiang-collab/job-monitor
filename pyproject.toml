[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-monitor"
version = "0.1.0"
description = "Monitor company job postings and report new roles."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "beautifulsoup4>=4.12",
    "curl-cffi>=0.7",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
job-monitor = "job_monitor.daily_run:main"
job_monitor = "job_monitor.daily_run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
