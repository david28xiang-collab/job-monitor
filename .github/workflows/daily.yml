name: Daily Job Monitor

on:
  schedule:
    - cron: '0 13 * * *'

  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas requests pyyaml beautifulsoup4

      - name: Run monitor
        run: |
          python daily_run.py
